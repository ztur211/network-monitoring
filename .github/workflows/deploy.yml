name: Deploy

# MANUAL-ONLY (workflow_dispatch). This targets DigitalOcean App Platform, which
# is NOT provisioned — the demo is self-hosted (see deploy/README.md). Auto-deploy
# on push to main/master was removed because it failed on every merge (no DO app,
# no secrets). Run it from the Actions tab once the DO app + the secrets below
# exist. It runs Prisma migrations against production, triggers an App Platform
# deployment, then smoke-tests the deployed app (covering paths App Platform's own
# healthcheck doesn't: auth session, CORS, WebSocket handshake, SPA shell + catchall).
#
# Required GitHub Actions secrets:
#   - PROD_DATABASE_URL          PgBouncer-fronted production DATABASE_URL
#   - DIGITALOCEAN_ACCESS_TOKEN  doctl token with apps:write scope
#   - DO_APP_ID                  DigitalOcean App Platform app UUID
#
# Cloud-side prerequisites (one-time, manual — see README.md):
#   - DigitalOcean Managed PostgreSQL with TimescaleDB + PostGIS extensions enabled
#   - DigitalOcean Managed Redis
#   - Spaces bucket (for floor plans / Agent installers, post-MVP)
#   - All env vars in .env.example set on the App Platform app
#   - Anthropic console: spend cap configured before first real traffic
#
# Smoke-test URLs are hardcoded below and must match the domains in
# .do/app.yaml. If you rename a domain, update both files in the same PR.

on:
  # Auto-deploy on push intentionally removed — there is no provisioned deploy
  # target (self-hosted demo). Dispatch manually once DigitalOcean is set up.
  workflow_dispatch:

# wait-on-check-action lists the commit's check-runs, which needs `checks: read`;
# without it GITHUB_TOKEN's restricted default permissions return 403.
permissions:
  contents: read
  checks: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: Build
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

  migrate:
    name: Apply DB Migrations
    runs-on: ubuntu-latest
    needs: wait-for-ci
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

  deploy:
    name: Deploy to DigitalOcean App Platform
    runs-on: ubuntu-latest
    needs: migrate
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Trigger deployment
        run: doctl apps create-deployment ${{ secrets.DO_APP_ID }} --wait

  smoke:
    name: Smoke test deployed app
    runs-on: ubuntu-latest
    needs: deploy
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Run smoke tests
        # URLs are hardcoded to match the ingress hostnames in .do/app.yaml.
        # The script exits 1 on any failed check, which fails this job and
        # surfaces the broken deploy in the workflow run.
        run: node scripts/smoke.mjs https://api.nodescope.io https://app.nodescope.io
