name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Numeric release version, for example 0.1.1
        required: true
        type: string
      prerelease:
        description: Mark a manually created release as a prerelease
        required: true
        default: true
        type: boolean
      publish_images:
        description: Publish appliance images for a manual release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Resolve and validate
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            version="${REF_NAME#v}"
            prerelease=false
          else
            version="$INPUT_VERSION"
            prerelease="$INPUT_PRERELEASE"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Version must be numeric, for example 0.1.1" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=v$version" >>"$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"

  agent:
    name: Agent (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            binary: NodeScope.Agent
            asset: nodescope-agent-linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            binary: NodeScope.Agent
            asset: nodescope-agent-linux-arm64
          - os: windows-latest
            rid: win-x64
            binary: NodeScope.Agent.exe
            asset: nodescope-agent-win-x64.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish NativeAOT binary
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet publish src/NodeScope.Agent \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained true \
            --output out/publish \
            -p:ContinuousIntegrationBuild=true \
            -p:Version="$VERSION"
          mkdir -p out/raw
          cp "out/publish/${{ matrix.binary }}" "out/raw/${{ matrix.asset }}"
          chmod 755 "out/raw/${{ matrix.asset }}" || true

      - name: Smoke-test binary
        run: |
          output="$(out/raw/${{ matrix.asset }} --version)"
          test -n "$output"
          echo "$output"

      - uses: actions/upload-artifact@v7
        with:
          name: raw-agent-${{ matrix.rid }}
          path: out/raw/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  signed-agent:
    name: Sign and stage agent payload
    runs-on: ubuntu-latest
    needs: [version, agent]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: raw-agent-*
          path: out/raw-agent
          merge-multiple: true

      - name: Validate platform set
        run: |
          test -f out/raw-agent/nodescope-agent-linux-x64
          test -f out/raw-agent/nodescope-agent-linux-arm64
          test -f out/raw-agent/nodescope-agent-win-x64.exe

      - name: Sign and create manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SIGNING_KEY: ${{ secrets.NODESCOPE_AGENT_SIGNING_KEY }}
        shell: bash
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "NODESCOPE_AGENT_SIGNING_KEY is required" >&2
            exit 1
          fi
          key_file="$RUNNER_TEMP/nodescope-agent-signing.pem"
          printf '%s\n' "$SIGNING_KEY" >"$key_file"
          chmod 600 "$key_file"
          scripts/agent-release/stage.sh \
            --version "$VERSION" \
            --input out/raw-agent \
            --output out/agent-dist \
            --key "$key_file"

      - uses: actions/upload-artifact@v7
        with:
          name: nodescope-agent-dist
          path: out/agent-dist/*
          if-no-files-found: error
          retention-days: 7

  desktop-linux:
    name: Desktop (linux-x64)
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish native client
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet publish src/NodeScope.Desktop \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output out/desktop \
            -p:ContinuousIntegrationBuild=true \
            -p:Version="$VERSION"
          tar --create --gzip \
            --file out/nodescope-desktop-linux-x64.tar.gz \
            --directory out/desktop .

      - uses: actions/upload-artifact@v7
        with:
          name: nodescope-desktop-linux-x64
          path: out/nodescope-desktop-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  desktop-windows:
    name: Desktop (win-x64)
    runs-on: windows-latest
    needs: version
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish native client
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: pwsh
        run: |
          dotnet publish src/NodeScope.Desktop `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output out/desktop `
            -p:ContinuousIntegrationBuild=true `
            -p:Version="$env:VERSION"
          Compress-Archive `
            -Path out/desktop/* `
            -DestinationPath out/nodescope-desktop-win-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: nodescope-desktop-win-x64
          path: out/nodescope-desktop-win-x64.zip
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [version, signed-agent, desktop-linux, desktop-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nodescope-agent-dist
          path: release-assets

      - uses: actions/download-artifact@v8
        with:
          name: nodescope-desktop-linux-x64
          path: release-assets

      - uses: actions/download-artifact@v8
        with:
          name: nodescope-desktop-win-x64
          path: release-assets

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        shell: bash
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease_args=()
            if [ "$PRERELEASE" = "true" ]; then
              prerelease_args+=(--prerelease)
            fi
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "NodeScope $TAG" \
              "${prerelease_args[@]}"
          fi
          gh release upload "$TAG" release-assets/* --clobber

  images:
    name: Publish appliance images
    runs-on: ubuntu-latest
    needs: [version, signed-agent]
    if: github.event_name == 'push' || inputs.publish_images
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: nodescope-agent-dist
          path: deploy/agent-dist

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nodescope-api:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/nodescope-api:latest
          provenance: mode=max
          sbom: true

      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nodescope-web:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/nodescope-web:latest
          provenance: mode=max
          sbom: true

      - name: Build and push tiles
        uses: docker/build-push-action@v7
        with:
          context: deploy/tiles
          file: deploy/tiles/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nodescope-tiles:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/nodescope-tiles:latest
          provenance: mode=max
          sbom: true
