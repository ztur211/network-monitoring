name: Deploy Stack Validation

on:
  # Manual while hosted Actions billing is disabled. This workflow is the
  # release-time proof that the appliance builds, migrates, routes, and backs up.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-stack:
    name: Build and smoke-test appliance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Write test appliance environment
        run: |
          cat >deploy/.env <<'ENV'
          PUBLIC_ORIGIN=http://localhost:8080
          POSTGRES_USER=nodescope
          POSTGRES_PASSWORD=ci-test-password
          POSTGRES_DB=nodescope
          SECRET_ENCRYPTION_KEY=Y2ktdGVzdC1lbmNyeXB0aW9uLWtleS0zMmJ5dGVzISE=
          GEOCODING_USER_AGENT=NodeScope/1.0 (ci@example.com)
          WEB_PORT=8080
          SITE_ADDRESS=:80
          STORAGE_DRIVER=fs
          ENV

      - name: Validate Compose configuration
        run: >-
          docker compose
          --file deploy/docker-compose.prod.yml
          --file deploy/docker-compose.build.yml
          --env-file deploy/.env
          config

      - name: Build and start appliance
        run: >-
          docker compose
          --file deploy/docker-compose.prod.yml
          --file deploy/docker-compose.build.yml
          --env-file deploy/.env
          up
          --detach
          --build
          --wait
          --wait-timeout 360

      - name: Smoke-test same-origin routes
        run: ./deploy/nodescope.sh smoke --origin http://localhost:8080 --no-tiles

      - name: Verify database backup
        shell: bash
        run: |
          backup_dir="$(mktemp -d)"
          deploy/backup.sh "$backup_dir"
          backup="$(find "$backup_dir" -maxdepth 1 -name '*.sql.gz' -print -quit)"
          test -n "$backup"
          gunzip --stdout "$backup" | grep --quiet "PostgreSQL database dump"

      - name: Print container logs on failure
        if: failure()
        run: >-
          docker compose
          --file deploy/docker-compose.prod.yml
          --file deploy/docker-compose.build.yml
          --env-file deploy/.env
          logs
          --no-color
          --tail 200

      - name: Tear down
        if: always()
        run: >-
          docker compose
          --file deploy/docker-compose.prod.yml
          --file deploy/docker-compose.build.yml
          --env-file deploy/.env
          down
          --volumes
