name: Deploy Stack Validation

# Builds and boots the self-hosted demo stack (deploy/docker-compose.prod.yml)
# on a runner, applies migrations, and runs the post-deploy smoke test — the
# same flow a host operator runs, but in CI. Proves the Dockerfiles + compose
# actually build, the API migrates and boots, Caddy serves the SPA + proxies
# the API, and Socket.io handshakes — without needing a real host or domain.
#
# Path-filtered so the heavy docker build only runs when something that affects
# the image actually changes (keeps normal CI fast / saves Actions minutes).

on:
  # Only the deploy config itself triggers this heavy (~15 min) build — app-code
  # buildability is already covered by the normal CI `build` job. Trigger it
  # manually (workflow_dispatch) after significant app/dependency changes that
  # could affect the production image or boot.
  pull_request:
    paths:
      - 'deploy/**'
      - '!deploy/**.md'          # docs-only edits don't need the full build
      - '.dockerignore'
      - 'scripts/smoke.mjs'
      - '.github/workflows/deploy-validate.yml'
  workflow_dispatch:

jobs:
  validate-stack:
    name: Build + smoke-test the compose stack
    # Self-hosted: GitHub-hosted Actions billing is unpaid. Runner must have Docker + buildx.
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Write a CI .env (test values only — same-origin on localhost:8080)
        run: |
          cat > deploy/.env <<'ENV'
          PUBLIC_ORIGIN=http://localhost:8080
          POSTGRES_USER=nodescope
          POSTGRES_PASSWORD=ci-test-password
          POSTGRES_DB=nodescope
          BETTER_AUTH_SECRET=ci-test-secret-minimum-32-characters-long
          ANTHROPIC_API_KEY=sk-ci-placeholder-not-used-by-smoke
          AI_PROVIDER=claude
          GEOCODING_USER_AGENT=NodeScope/1.0 (ci@example.com)
          WEB_PORT=8080
          SITE_ADDRESS=:80
          SECRET_ENCRYPTION_KEY=bm9kZXNjb3BlLWNpLXNlY3JldC1rZXktMzJieXRlcyE=
          STORAGE_DRIVER=fs
          ENV

      - name: Validate compose config
        run: |
          docker compose -f deploy/docker-compose.prod.yml \
            -f deploy/docker-compose.build.yml --env-file deploy/.env config >/dev/null

      - name: Build images + bring up the stack (waits for healthchecks)
        run: |
          docker compose -f deploy/docker-compose.prod.yml \
            -f deploy/docker-compose.build.yml --env-file deploy/.env \
            up -d --build --wait --wait-timeout 360

      - name: Smoke test the running stack
        run: node scripts/smoke.mjs http://localhost:8080 http://localhost:8080

      - name: Backup → restore round-trip (with data sentinel)
        run: |
          C="docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env"
          # seed a DB sentinel + a blob sentinel BEFORE backing up
          $C exec -T db psql -U nodescope nodescope -c "CREATE TABLE restore_probe(v text); INSERT INTO restore_probe VALUES ('sentinel-42');"
          $C run --rm --no-deps --entrypoint sh api -c 'echo blob-sentinel > /data/storage/_probe'
          # back up
          deploy/nodescope.sh backup /tmp/ns-backups
          b="$(ls -1d /tmp/ns-backups/nodescope-* | sort | tail -1)"
          gunzip -c "$b/db.sql.gz" | grep -q "PostgreSQL database dump" || { echo "no valid pg_dump in $b"; exit 1; }
          test -f "$b/blobs.tar.gz" && test -f "$b/manifest.txt" || { echo "bundle incomplete"; exit 1; }
          # destroy the sentinels to prove restore actually recovers them
          $C exec -T db psql -U nodescope nodescope -c "DROP TABLE restore_probe;"
          $C run --rm --no-deps --entrypoint sh api -c 'rm -f /data/storage/_probe'
          # restore
          deploy/nodescope.sh restore "$b"
          # assert the DB sentinel came back (proves data, not just schema, round-trips)
          got="$($C exec -T db psql -tAqX -U nodescope nodescope -c 'SELECT v FROM restore_probe')"
          got="$(printf '%s' "$got" | tr -d '[:space:]')"
          [ "$got" = "sentinel-42" ] || { echo "DB sentinel not recovered (got: '$got')"; exit 1; }
          # assert the blob sentinel came back
          blob="$($C run --rm --no-deps --entrypoint sh api -c 'cat /data/storage/_probe 2>/dev/null || true')"
          printf '%s' "$blob" | grep -q 'blob-sentinel' || { echo "blob sentinel not recovered (got: '$blob')"; exit 1; }
          # final smoke on the restored stack
          node scripts/smoke.mjs http://localhost:8080 http://localhost:8080
          echo "backup→restore round-trip OK (db + blob sentinels recovered)"

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env down -v
