name: Desktop Build

# On-demand Windows installer build. The Windows NSIS installer is heavy, so it's
# manual-only here. Tag releases (`v*`) build + attach the installer via release.yml
# (which also builds the agent binaries and creates the GitHub Release) — keeping
# the tag trigger here too would double-build it. Unit/lint/e2e run in the main CI.
on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Package Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run package:win --workspace=apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: nodescope-desktop-win
          path: apps/desktop/release/*.exe
          if-no-files-found: error
