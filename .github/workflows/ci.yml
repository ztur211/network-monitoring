name: CI

on:
  # Kept manual while the repository has no funded hosted runner and its
  # self-hosted runner is offline. The jobs use standard hosted labels so the
  # workflow is ready to re-enable for push and pull_request.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, lint, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Verify .NET formatting
        run: dotnet format NodeScope.slnx --verify-no-changes --no-restore

      - name: Build .NET
        run: >-
          dotnet build NodeScope.slnx
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Run .NET unit and architecture tests
        shell: bash
        run: |
          projects=(
            tests/NodeScope.ArchitectureTests/NodeScope.ArchitectureTests.csproj
            tests/NodeScope.Platform.Tests/NodeScope.Platform.Tests.csproj
            tests/NodeScope.Monitoring.Tests/NodeScope.Monitoring.Tests.csproj
            tests/NodeScope.Agent.Tests/NodeScope.Agent.Tests.csproj
            tests/NodeScope.Desktop.Tests/NodeScope.Desktop.Tests.csproj
          )
          for project in "${projects[@]}"; do
            dotnet test "$project" --configuration Release --no-build
          done

  contract:
    name: Black-box API contract
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: nodescope
          POSTGRES_PASSWORD: localdevpassword
          POSTGRES_DB: nodescope_test
          PGCTLTIMEOUT: "300"
          TS_TUNE_MEMORY: 1GB
          TS_TUNE_NUM_CPUS: "2"
          TS_TUNE_MAX_CONNS: "100"
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U nodescope -d nodescope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    env:
      ASPNETCORE_URLS: http://127.0.0.1:5199
      DATABASE_URL: postgresql://nodescope:localdevpassword@localhost:5433/nodescope_test
      NODESCOPE_DATABASE_URL: postgresql://nodescope:localdevpassword@localhost:5433/nodescope_test
      SECRET_ENCRYPTION_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      THROTTLE_DEFAULT_LIMIT: "100000"
      THROTTLE_AUTH_LIMIT: "100000"
      REFRESH_INTERVAL_SECONDS: "2"
      STORAGE_ENDPOINT: http://localhost:9100
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: nodescope-test
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      SEED_PASSWORD: devpassword123
      NODESCOPE_BASE_URL: http://127.0.0.1:5199
      NODESCOPE_REALTIME_TRANSPORT: signalr
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET
        run: dotnet restore NodeScope.slnx

      - name: Start MinIO
        run: |
          docker run --detach --name nodescope-ci-minio \
            --publish 9100:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9100/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become ready" >&2
          exit 1

      - name: Apply migrations and seed
        run: >-
          dotnet run
          --project src/NodeScope.Api
          --configuration Release
          --no-restore
          --
          seed

      - name: Start API
        shell: bash
        run: |
          dotnet run \
            --project src/NodeScope.Api \
            --configuration Release \
            --no-restore \
            >/tmp/nodescope-api.log 2>&1 &
          echo "$!" >/tmp/nodescope-api.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5199/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/nodescope-api.log
          exit 1

      - name: Run contract suite
        run: >-
          dotnet test tests/NodeScope.ContractTests
          --configuration Release
          --no-restore

      - name: Run native-client live flows
        env:
          NODESCOPE_DESKTOP_E2E_BASE_URL: http://127.0.0.1:5199
          NODESCOPE_DESKTOP_ASSISTANT_E2E_BASE_URL: http://127.0.0.1:5199
          NODESCOPE_DESKTOP_INVENTORY_E2E_BASE_URL: http://127.0.0.1:5199
          NODESCOPE_DESKTOP_SETTINGS_E2E_BASE_URL: http://127.0.0.1:5199
          NODESCOPE_DESKTOP_REALTIME_E2E_BASE_URL: http://127.0.0.1:5199
        run: >-
          dotnet test tests/NodeScope.Desktop.Tests
          --configuration Release
          --no-restore
          --filter
          "FullyQualifiedName~DesktopAuthE2ETests|FullyQualifiedName~AssistantE2ETests|FullyQualifiedName~InventoryE2ETests|FullyQualifiedName~SettingsE2ETests|FullyQualifiedName~RealtimeE2ETests"

      - name: Print API log on failure
        if: failure()
        run: cat /tmp/nodescope-api.log

      - name: Stop test processes
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/nodescope-api.pid ]; then
            kill "$(cat /tmp/nodescope-api.pid)" 2>/dev/null || true
          fi
          docker rm --force nodescope-ci-minio 2>/dev/null || true
