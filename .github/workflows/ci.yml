name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: nodescope
          POSTGRES_PASSWORD: localdevpassword
          POSTGRES_DB: nodescope_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nodescope:localdevpassword@localhost:5433/nodescope_test
      REDIS_URL: redis://localhost:6380
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://nodescope:localdevpassword@localhost:5433/nodescope_test
      - run: npm run test:integration

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [unit, integration]
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: nodescope
          POSTGRES_PASSWORD: localdevpassword
          POSTGRES_DB: nodescope_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nodescope:localdevpassword@localhost:5433/nodescope_test
      REDIS_URL: redis://localhost:6380
      BETTER_AUTH_SECRET: ci-test-secret-minimum-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:8081
      NODE_ENV: test
      PORT: 3000
      # StorageService (Spec 1) connects to MinIO at app boot via ensureBucket().
      # Mirrors jest.e2e.setup.ts defaults and the docker-compose.test.yml minio-test service.
      STORAGE_ENDPOINT: http://localhost:9100
      STORAGE_BUCKET: nodescope-test
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      # Spec 9 CryptoModule throws at app boot if this is unset / not 32 bytes
      # base64-decoded; every e2e suite boots AppModule, so without it the whole
      # tier mass-fails. Test-only value (base64 of a throwaway 32-byte string).
      SECRET_ENCRYPTION_KEY: Y2ktdGVzdC1lbmNyeXB0aW9uLWtleS0zMmJ5dGVzISE=
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # MinIO can't run as a GitHub service container (the minio/minio image needs the
      # `server /data` command, which service containers can't supply), so start it as a step.
      - name: Start MinIO (object storage; StorageService.ensureBucket runs at AppModule boot)
        run: |
          docker run -d --name minio -p 9100:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9100/minio/health/live > /dev/null; then
              echo "MinIO ready"; exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become ready in time" >&2; exit 1
      - run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://nodescope:localdevpassword@localhost:5433/nodescope_test
      - run: npm run test:e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: e2e
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
