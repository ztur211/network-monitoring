name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel an in-progress run when a newer commit lands on the same ref, so a burst of pushes
# (e.g. merging a stack of PRs) doesn't queue a full CI run per commit - only the latest runs.
# Keyed by ref, so different branches/PRs never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run lint

  unit:
    name: Unit Tests
    runs-on: [self-hosted, linux, x64]
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run test:unit

  integration:
    name: Integration Tests
    runs-on: [self-hosted, linux, x64]
    needs: lint
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: nodescope
          POSTGRES_PASSWORD: localdevpassword
          POSTGRES_DB: nodescope_test
          # The entrypoint restarts postgres after running init scripts; on a busy
          # self-hosted box the shutdown checkpoint can exceed pg_ctl's default 60s
          # timeout, which kills the container mid-init. Give it generous headroom.
          PGCTLTIMEOUT: "300"
          # timescaledb-tune sizes shared_buffers etc. to the whole host by default,
          # which starves the jest workers and app instances sharing this runner
          # (observed as multi-minute machine-wide stalls in e2e). Cap it to a
          # CI-appropriate slice of the box.
          TS_TUNE_MEMORY: 2GB
          TS_TUNE_NUM_CPUS: "2"
          # timescaledb-tune derives max_connections from the CPU count, so the pin above
          # also cuts it 100 → 25 - enough for two jest workers' Prisma pools to exhaust it
          # ("sorry, too many clients already") on suites that open many concurrent writes.
          TS_TUNE_MAX_CONNS: "100"
        ports:
          - 5433:5432
        # -h localhost forces the health check over TCP: the temporary init-phase
        # server only listens on the unix socket, so plain `pg_isready` reports
        # healthy before initialization has actually finished.
        options: >-
          --health-cmd "pg_isready -h localhost -U nodescope -d nodescope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nodescope:localdevpassword@localhost:5433/nodescope_test
      REDIS_URL: redis://localhost:6380
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Belt-and-suspenders for the health check above: on a loaded runner the
      # container can lag behind "Initialize containers", so re-verify over TCP
      # right before touching the database.
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 60); do
            if docker exec ${{ job.services.postgres.id }} pg_isready -h localhost -U nodescope -d nodescope_test > /dev/null 2>&1; then
              echo "Postgres ready"; exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2; exit 1
      - run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://nodescope:localdevpassword@localhost:5433/nodescope_test
      - run: npm run test:integration

  e2e:
    name: E2E Tests
    runs-on: [self-hosted, linux, x64]
    needs: [unit, integration]
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: nodescope
          POSTGRES_PASSWORD: localdevpassword
          POSTGRES_DB: nodescope_test
          # The entrypoint restarts postgres after running init scripts; on a busy
          # self-hosted box the shutdown checkpoint can exceed pg_ctl's default 60s
          # timeout, which kills the container mid-init. Give it generous headroom.
          PGCTLTIMEOUT: "300"
          # timescaledb-tune sizes shared_buffers etc. to the whole host by default,
          # which starves the jest workers and app instances sharing this runner
          # (observed as multi-minute machine-wide stalls in e2e). Cap it to a
          # CI-appropriate slice of the box.
          TS_TUNE_MEMORY: 2GB
          TS_TUNE_NUM_CPUS: "2"
          # timescaledb-tune derives max_connections from the CPU count, so the pin above
          # also cuts it 100 → 25 - enough for two jest workers' Prisma pools to exhaust it
          # ("sorry, too many clients already") on suites that open many concurrent writes.
          TS_TUNE_MAX_CONNS: "100"
        ports:
          - 5433:5432
        # -h localhost forces the health check over TCP: the temporary init-phase
        # server only listens on the unix socket, so plain `pg_isready` reports
        # healthy before initialization has actually finished.
        options: >-
          --health-cmd "pg_isready -h localhost -U nodescope -d nodescope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nodescope:localdevpassword@localhost:5433/nodescope_test
      REDIS_URL: redis://localhost:6380
      BETTER_AUTH_SECRET: ci-test-secret-minimum-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:8081
      NODE_ENV: test
      PORT: 3000
      # StorageService (Spec 1) connects to MinIO at app boot via ensureBucket().
      # Mirrors jest.e2e.setup.ts defaults and the docker-compose.test.yml minio-test service.
      STORAGE_ENDPOINT: http://localhost:9100
      STORAGE_BUCKET: nodescope-test
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      # Spec 9 CryptoModule throws at app boot if this is unset / not 32 bytes
      # base64-decoded; every e2e suite boots AppModule, so without it the whole
      # tier mass-fails. Test-only value (base64 of a throwaway 32-byte string).
      SECRET_ENCRYPTION_KEY: Y2ktdGVzdC1lbmNyeXB0aW9uLWtleS0zMmJ5dGVzISE=
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # MinIO can't run as a GitHub service container (the minio/minio image needs the
      # `server /data` command, which service containers can't supply), so start it as a step.
      - name: Start MinIO (object storage; StorageService.ensureBucket runs at AppModule boot)
        run: |
          # Self-hosted runners are persistent, so a leftover container from a prior run would
          # collide on --name; remove any stale one first (no-op on a fresh/ephemeral runner).
          docker rm -f minio 2>/dev/null || true
          docker run -d --name minio -p 9100:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9100/minio/health/live > /dev/null; then
              echo "MinIO ready"; exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become ready in time" >&2; exit 1
      # Belt-and-suspenders for the health check above: on a loaded runner the
      # container can lag behind "Initialize containers", so re-verify over TCP
      # right before touching the database.
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 60); do
            if docker exec ${{ job.services.postgres.id }} pg_isready -h localhost -U nodescope -d nodescope_test > /dev/null 2>&1; then
              echo "Postgres ready"; exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2; exit 1
      - run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://nodescope:localdevpassword@localhost:5433/nodescope_test
      - run: npm run test:e2e

  build:
    name: Build
    runs-on: [self-hosted, linux, x64]
    needs: e2e
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run build
