# Composite action: the .NET setup shared by CI jobs.
# Run AFTER actions/checkout (a local action needs the repo already checked out).
name: Set up NodeScope toolchain
description: Set up .NET 10 and restore the dependency graph.
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - run: dotnet restore NodeScope.slnx
      shell: bash
