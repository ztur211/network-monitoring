services:
  db-test:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: nodescope
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: nodescope_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodescope -d nodescope_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
