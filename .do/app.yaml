# DigitalOcean App Platform spec for NodeScope.
#
# This spec is applied automatically when the app is created from this repo.
# Subsequent commits to the configured branch trigger redeploys with the spec
# from the new commit, so this file is the source of truth for platform config.
#
# Apply manually:
#   doctl apps update <APP_ID> --spec .do/app.yaml
# Create initially:
#   doctl apps create --spec .do/app.yaml
#
# Secrets and connection strings are NOT in this file. Set them once on the app:
#   doctl apps update <APP_ID> --spec - <<<"$(doctl apps spec get <APP_ID>)"
# or via the DO console. Required secrets:
#   - DATABASE_URL              PgBouncer-fronted managed Postgres (PostGIS + TimescaleDB enabled)
#   - REDIS_URL                 Managed Redis connection string
#   - BETTER_AUTH_SECRET        Min 32 chars, generate with `openssl rand -base64 48`
#   - ANTHROPIC_API_KEY         From console.anthropic.com (set spend cap first)
#   - SEED_PASSWORD             Optional, only for one-shot seeding via `prisma db seed`
#
# Domain placeholders (api.nodescope.io / app.nodescope.io) must match the
# domains configured under `domains:` and the DNS records pointing at the
# App Platform load balancer.

name: nodescope
region: nyc

# Domains attached to the app. Both should be CNAME'd to the App Platform
# default ingress hostname (visible in the DO console after first deploy).
domains:
  - domain: api.nodescope.io
    type: PRIMARY
    zone: nodescope.io
  - domain: app.nodescope.io
    type: ALIAS
    zone: nodescope.io

services:
  - name: api
    # NestJS backend. Routes prefixed with `/api` (see main.ts setGlobalPrefix).
    github:
      repo: ztur211/nodescope
      branch: master
      deploy_on_push: true
    source_dir: /
    # Workspace install + Prisma client generation + Nest build.
    # legacy-peer-deps matches the root .npmrc; App Platform's npm honors it.
    build_command: |
      npm ci --legacy-peer-deps
      npx prisma generate --schema=apps/api/prisma/schema.prisma
      npm run build --workspace=apps/api
    run_command: node apps/api/dist/main.js
    instance_size_slug: basic-xxs
    instance_count: 2
    http_port: 3000
    health_check:
      http_path: /api/health
      initial_delay_seconds: 15
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 3
      success_threshold: 1
    # Note: routing is configured in the top-level `ingress` block below so we
    # can split by hostname. Do not add a per-component `routes:` field here.
    envs:
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: PORT
        scope: RUN_TIME
        value: "3000"
      - key: BETTER_AUTH_URL
        scope: RUN_TIME
        value: https://api.nodescope.io
      - key: FRONTEND_URL
        scope: RUN_TIME
        value: https://app.nodescope.io
      - key: AI_PROVIDER
        scope: RUN_TIME
        value: claude
      - key: GEOCODING_USER_AGENT
        scope: RUN_TIME
        value: NodeScope/1.0 (ops@nodescope.io)
      # SECRET env vars — set via `doctl apps update` or the console, NOT here.
      # Listed with empty values so the spec round-trips without losing them.
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: ""
      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: BETTER_AUTH_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ""

static_sites:
  - name: web
    # Expo Web static export. Output is a single index.html + JS/CSS bundles.
    github:
      repo: ztur211/nodescope
      branch: master
      deploy_on_push: true
    source_dir: /
    build_command: |
      npm ci --legacy-peer-deps
      npm run build --workspace=apps/web
    output_dir: apps/web/dist
    # SPA mode — every unknown path falls through to index.html so expo-router
    # can handle client-side routing.
    catchall_document: index.html
    # Note: routing is configured in the top-level `ingress` block below so we
    # can split by hostname. Do not add a per-component `routes:` field here.
    envs:
      - key: EXPO_PUBLIC_API_URL
        scope: BUILD_TIME
        value: https://api.nodescope.io

# Host-based ingress. Each domain routes to exactly one component, so the
# cross-domain leakage of the legacy per-component `routes` model is avoided:
#   api.nodescope.io/*   → api service (NestJS, /api prefix preserved)
#   app.nodescope.io/*   → web static site (SPA, expo-router client-side routes)
# Anything hitting the wrong domain (e.g. app.nodescope.io/api/foo) gets the
# static site's index.html instead of the API — the API is unreachable from the
# app domain, which matches the cookie/CORS posture in main.ts.
ingress:
  rules:
    - match:
        authority:
          exact: api.nodescope.io
        path:
          prefix: /
      component:
        name: api
        # preserve_path_prefix keeps `/api/...` intact for NestJS's
        # setGlobalPrefix('api') — otherwise App Platform trims the matched
        # prefix from the upstream request.
        preserve_path_prefix: true
    - match:
        authority:
          exact: app.nodescope.io
        path:
          prefix: /
      component:
        name: web
