services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: nodescope
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: nodescope_dev
      # See docker-compose.test.yml: unbounded, timescaledb-tune sizes itself to the
      # whole host and the dev + test stacks together exceed the WSL2 VM's ceiling.
      TS_TUNE_MEMORY: 1GB
      TS_TUNE_NUM_CPUS: "2"
      # See docker-compose.test.yml - pinning CPUs would otherwise cut max_connections to 25.
      # NOTE: these are initdb-time settings. The dev db has a persistent volume, so they only
      # take effect on a fresh volume (`docker compose down -v`), unlike the throwaway test db.
      TS_TUNE_MAX_CONNS: "100"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 1500m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodescope -d nodescope_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
