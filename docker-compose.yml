services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: nodescope
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: nodescope_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodescope -d nodescope_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
