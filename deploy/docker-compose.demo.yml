# NodeScope 3D DEMO overlay - layered on the appliance base to pre-load the
# public "FZK-Haus" sample building so `up` gives you something to view right away.
#
#   docker compose \
#     -f deploy/docker-compose.prod.yml -f deploy/docker-compose.demo.yml \
#     --env-file deploy/.env.demo up -d
#
# (Add -f deploy/docker-compose.build.yml before --env-file to build locally
#  instead of pulling from GHCR.)
#
# The appliance base already runs single-node (no Redis) with fs storage (no
# MinIO) and the crypto key, so this overlay only adds a one-shot that seeds the
# demo org/site/building and uploads the sample IFC. Then open the native desktop
# client, enter http://localhost:8080, sign in, and open Main Building.
# See deploy/DEMO.md for the full walkthrough.
name: nodescope

services:
  demo-seed:
    image: ghcr.io/ztur211/nodescope-api:${NODESCOPE_VERSION:-latest}
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
    environment:
      DATABASE_URL: Host=db;Port=5432;Database=${POSTGRES_DB:-nodescope};Username=${POSTGRES_USER:-nodescope};Password=${POSTGRES_PASSWORD}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY in deploy/.env.demo}
      STORAGE_DRIVER: fs
      STORAGE_FS_ROOT: /data/storage
      SEED_EMAIL: ${SEED_EMAIL:-owner@acme.test}
      SEED_PASSWORD: ${SEED_PASSWORD:-devpassword123}
      # Also upload the real FZK-Haus IFC through the API (needs internet on first run),
      # so the 3D viewer shows an actual building instead of the placeholder's empty
      # scene. Override with SEED_SAMPLE_MODEL=false (run-desktop.sh --no-model).
      SEED_SAMPLE_MODEL: ${SEED_SAMPLE_MODEL:-true}
    volumes:
      - blobstore:/data/storage
    # The seed runs in-process against its own loopback server (same image, `seed` arg):
    # org/site/building, owner + super-admin, devices, placeholder model, sample IFC.
    command: ["seed"]
