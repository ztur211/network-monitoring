# NodeScope self-hosted appliance stack. See deploy/README.md for the full runbook,
# or run `deploy/nodescope.sh install` for a one-command setup.
#
#   cp deploy/.env.example deploy/.env     # then fill in secrets + PUBLIC_ORIGIN
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d
#
# This pulls prebuilt images (ghcr.io/ztur211/nodescope-*). To build locally
# instead, add the build overlay and --build:
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.build.yml \
#     --env-file deploy/.env up -d --build
#
# Add `--profile tunnel` to also run cloudflared (needs CLOUDFLARE_TUNNEL_TOKEN).

name: nodescope

# Bound container logs so a long-running demo can't fill the host disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Bound container RESOURCES for the same reason we bound the logs: a single misbehaving
# service must degrade itself, not the box. Without a limit a container inherits the whole
# host, so a runaway (a probe-cycle pileup, a leak, a runaway query) starves every other
# service and the host itself instead of being contained and restarted.
#
# The defaults target a modest 4GB/2-core appliance host and are deliberately conservative;
# raise them in deploy/.env on a bigger box. A container that exceeds its memory limit is
# OOM-killed and restarted by `restart: unless-stopped` - a loud, recoverable failure, which
# is the point. CPU limits throttle rather than kill.

services:
  db:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-1g}
          cpus: "${DB_CPU_LIMIT:-1.0}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nodescope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-nodescope}
      # Pin timescaledb-tune to the CONTAINER's share, not the whole host: unbounded it
      # sizes shared_buffers/effective_cache_size to total host memory and starves
      # every other service. Keep these in step with DB_MEMORY_LIMIT/DB_CPU_LIMIT.
      # NOTE initdb-time settings - they only apply to a FRESH data directory. Pinning
      # CPUs also drops max_connections, so it is pinned back up explicitly.
      TS_TUNE_MEMORY: ${DB_TUNE_MEMORY:-1GB}
      TS_TUNE_NUM_CPUS: ${DB_TUNE_NUM_CPUS:-1}
      TS_TUNE_MAX_CONNS: ${DB_TUNE_MAX_CONNS:-100}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nodescope} -d ${POSTGRES_DB:-nodescope}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No host port published - reachable only inside the compose network.

  # (The optional Redis service is gone with the Node stack: the ASP.NET Core host keeps
  # all interim state in-process on the single-node appliance - Decision 8. A multi-node
  # MSP deployment reintroduces Redis as a SignalR backplane, nothing else.)

  api:
    image: ghcr.io/ztur211/nodescope-api:${NODESCOPE_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # The .NET GC is cgroup-aware: its default heap limit is 75% of this cap, so
          # heap growth surfaces as a logged OutOfMemoryException inside the app rather
          # than a silent container OOM-kill. No knob to keep in step.
          memory: ${API_MEMORY_LIMIT:-1g}
          cpus: "${API_CPU_LIMIT:-1.0}"
    environment:
      # Still read by the C# host: it gates the production rate limits on Node's exact
      # NODE_ENV check, so the wire behavior of the Node era carries over unchanged.
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-nodescope}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nodescope}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in deploy/.env}
      # SNMP credential encryption refuses to boot without a base64-encoded
      # 32-byte key: `openssl rand -base64 32`.
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY in deploy/.env (openssl rand -base64 32)}
      # Same-origin appliance: both the API base and the auth base are the public origin
      # (desktop-auth builds its redirects from these).
      BETTER_AUTH_URL: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in deploy/.env}
      FRONTEND_URL: ${PUBLIC_ORIGIN}
      GEOCODING_USER_AGENT: ${GEOCODING_USER_AGENT:-NodeScope/1.0 (demo@example.com)}
      # Proxy hops to trust for the real client IP (rate-limit keying). 1 = the single
      # Caddy hop (default); behind Cloudflare Tunnel → Caddy → API set 2, or every
      # external user shares one Cloudflare edge address and the strict auth budget.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Embedded prober: OFF unless the appliance sits on the network it monitors.
      # A cycle that outlasts the interval is skipped (with a warning), never stacked -
      # see deploy/.env.example for how to size the interval to the fleet.
      MONITORING_PROBER_ENABLED: ${MONITORING_PROBER_ENABLED:-false}
      MONITORING_PROBE_INTERVAL_MS: ${MONITORING_PROBE_INTERVAL_MS:-30000}
      MONITORING_PROBE_CONCURRENCY: ${MONITORING_PROBE_CONCURRENCY:-20}
      MONITORING_PROBE_TIMEOUT_MS: ${MONITORING_PROBE_TIMEOUT_MS:-2000}
      MONITORING_PROBE_PORTS: ${MONITORING_PROBE_PORTS:-443,80,22}
      # Single-node appliance default: blobs on the local blobstore volume (no
      # MinIO/S3 to run). To use S3/MinIO instead, set STORAGE_DRIVER=s3 in
      # deploy/.env and add the STORAGE_ENDPOINT/…/SECRET_KEY env here.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-fs}
      STORAGE_FS_ROOT: /data/storage
    volumes:
      - blobstore:/data/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5

  # Map tiles (Decision 15): tileserver-gl (MapLibre GL Native) rasterizes the
  # liberty style from an OpenMapTiles-schema region extract, so the desktop map
  # fetches every tile from THIS box - zero WAN at runtime, per the local-first
  # rule. Styles/glyphs/sprites are baked into the image (deploy/tiles/); the
  # region extract lives on the tiledata volume and is produced once at install
  # by `nodescope.sh tiles` (the tiles-build one-shot below).
  tiles:
    image: ghcr.io/ztur211/nodescope-tiles:${NODESCOPE_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          # Rendering is the memory hog here: each pooled MapLibre renderer holds
          # style + fonts + the tiles it rasterizes. Pool sizes are capped in
          # deploy/tiles/config.json to fit this budget.
          memory: ${TILES_MEMORY_LIMIT:-768m}
          cpus: "${TILES_CPU_LIMIT:-1.0}"
    volumes:
      - tiledata:/data
    healthcheck:
      # The base image ships no curl/wget; node is the app runtime, so it probes itself.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  # One-shot region-extract builder, run by `nodescope.sh tiles` (never `up`):
  # planetiler downloads the OSM area and writes /data/region.mbtiles onto the
  # tiledata volume. Profiled out of normal lifecycle commands; arguments are
  # passed by nodescope.sh, so the command here is only the no-args default.
  tiles-build:
    image: ghcr.io/onthegomap/planetiler:0.10.2
    profiles: ["tilesbuild"]
    restart: "no"
    logging: *default-logging
    environment:
      # Cap the JVM heap below the container limit; planetiler needs the gap for
      # off-heap buffers. Both scale together via TILES_BUILD_* in deploy/.env.
      JAVA_TOOL_OPTIONS: "-Xmx${TILES_BUILD_HEAP:-2g}"
    deploy:
      resources:
        limits:
          memory: ${TILES_BUILD_MEMORY_LIMIT:-3g}
          cpus: "${TILES_BUILD_CPU_LIMIT:-2.0}"
    volumes:
      - tiledata:/data

  web:
    # Origin-agnostic image (same-origin at runtime - see apps/web/lib/api-base.ts),
    # so no PUBLIC_ORIGIN is baked and no rebuild is needed on IP change.
    image: ghcr.io/ztur211/nodescope-web:${NODESCOPE_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: ${WEB_MEMORY_LIMIT:-192m}
          cpus: "${WEB_CPU_LIMIT:-0.5}"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      API_UPSTREAM: api:3000
    ports:
      - "${WEB_PORT:-8080}:80"

  # Optional: Cloudflare Tunnel (free TLS + hostname, no inbound ports).
  # Enable with `--profile tunnel`. In the Cloudflare dashboard, route your
  # hostname to http://web:80; paste the tunnel token into deploy/.env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    logging: *default-logging
    command: ["tunnel", "--no-autoupdate", "run"]
    deploy:
      resources:
        limits:
          memory: ${TUNNEL_MEMORY_LIMIT:-128m}
          cpus: "${TUNNEL_CPU_LIMIT:-0.5}"
    environment:
      # Plain default (not `:?`) so `docker compose config/up` without the
      # `tunnel` profile don't fail on a missing token - compose interpolates
      # every service's env at parse time regardless of active profiles.
      # cloudflared only runs under `--profile tunnel`, where an empty token
      # makes it exit with a clear error.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web

volumes:
  pgdata:
  blobstore:
  tiledata:
