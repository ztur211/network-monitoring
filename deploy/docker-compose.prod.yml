# NodeScope self-hosted appliance stack. See deploy/README.md for the full runbook,
# or run `deploy/nodescope.sh install` for a one-command setup.
#
#   cp deploy/.env.example deploy/.env     # then fill in secrets + PUBLIC_ORIGIN
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d
#
# This pulls prebuilt images (ghcr.io/ztur211/nodescope-*). To build locally
# instead, add the build overlay and --build:
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.build.yml \
#     --env-file deploy/.env up -d --build
#
# Add `--profile tunnel` to also run cloudflared (needs CLOUDFLARE_TUNNEL_TOKEN).

name: nodescope

# Bound container logs so a long-running demo can't fill the host disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Bound container RESOURCES for the same reason we bound the logs: a single misbehaving
# service must degrade itself, not the box. Without a limit a container inherits the whole
# host, so a runaway (a probe-cycle pileup, a leak, a runaway query) starves every other
# service and the host itself instead of being contained and restarted.
#
# The defaults target a modest 4GB/2-core appliance host and are deliberately conservative;
# raise them in deploy/.env on a bigger box. A container that exceeds its memory limit is
# OOM-killed and restarted by `restart: unless-stopped` - a loud, recoverable failure, which
# is the point. CPU limits throttle rather than kill.

services:
  db:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-1g}
          cpus: "${DB_CPU_LIMIT:-1.0}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nodescope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-nodescope}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nodescope} -d ${POSTGRES_DB:-nodescope}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No host port published - reachable only inside the compose network.

  # Redis is OPTIONAL - only needed for MULTI-REPLICA deployments. The single-node
  # appliance runs the API against an in-memory backing and never starts this service.
  # Enable it with `--profile redis` and set REDIS_URL + CLUSTER_MODE in deploy/.env.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # maxmemory + an eviction policy so Redis bounds its own heap *inside* the container
    # limit: it evicts cold keys rather than growing until the OOM killer takes the whole
    # service down. Kept just under the container limit to leave room for overhead/AOF.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-192mb}
      - --maxmemory-policy
      - allkeys-lru
    profiles: ["redis"]
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-256m}
          cpus: "${REDIS_CPU_LIMIT:-0.5}"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ghcr.io/ztur211/nodescope-api:${NODESCOPE_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    # No hard dependency on redis: single-node boots without it. When you run
    # `--profile redis`, start redis first (or just re-run `up`, it will start too).
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-1g}
          cpus: "${API_CPU_LIMIT:-1.0}"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Cap V8's old-space *below* the container limit (default ~75% of 1g), so heap growth
      # hits a GC ceiling and throws inside Node - where it is logged and recoverable -
      # instead of the container being OOM-killed with no explanation. Keep this in step
      # with API_MEMORY_LIMIT if you raise it.
      NODE_OPTIONS: ${API_NODE_OPTIONS:---max-old-space-size=768}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nodescope}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nodescope}
      # Empty by default = single-node in-memory backing. For multi-replica set this to
      # redis://redis:6379 and CLUSTER_MODE=true in deploy/.env, and use `--profile redis`.
      REDIS_URL: ${REDIS_URL:-}
      CLUSTER_MODE: ${CLUSTER_MODE:-false}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in deploy/.env}
      # CryptoModule (SNMP credential encryption) refuses to boot without a
      # base64-encoded 32-byte key: `openssl rand -base64 32`.
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY in deploy/.env (openssl rand -base64 32)}
      # Same-origin demo: both the API base and the auth base are the public origin.
      BETTER_AUTH_URL: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in deploy/.env}
      FRONTEND_URL: ${PUBLIC_ORIGIN}
      # AI is local-model-only and entirely optional. Unset AI_BASE_URL means no
      # assistant: the API boots normally and chat falls back to a canned
      # network-aware summary. No hosted provider exists, by design — the AI
      # context carries device IPs and topology that must not leave the site.
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-qwen2.5}
      GEOCODING_USER_AGENT: ${GEOCODING_USER_AGENT:-NodeScope/1.0 (demo@example.com)}
      # Proxy hops to trust for the real client IP (per-IP AI rate limiting +
      # checkOnHome). 1 = the single Caddy hop (default); behind Cloudflare
      # Tunnel → Caddy → API set 2.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Embedded prober: OFF unless the appliance sits on the network it monitors.
      # A cycle that outlasts the interval is skipped (with a warning), never stacked -
      # see deploy/.env.example for how to size the interval to the fleet.
      MONITORING_PROBER_ENABLED: ${MONITORING_PROBER_ENABLED:-false}
      MONITORING_PROBE_INTERVAL_MS: ${MONITORING_PROBE_INTERVAL_MS:-30000}
      MONITORING_PROBE_CONCURRENCY: ${MONITORING_PROBE_CONCURRENCY:-20}
      MONITORING_PROBE_TIMEOUT_MS: ${MONITORING_PROBE_TIMEOUT_MS:-2000}
      MONITORING_PROBE_PORTS: ${MONITORING_PROBE_PORTS:-443,80,22}
      # Single-node appliance default: blobs on the local blobstore volume (no
      # MinIO/S3 to run). To use S3/MinIO instead, set STORAGE_DRIVER=s3 in
      # deploy/.env and add the STORAGE_ENDPOINT/…/SECRET_KEY env here.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-fs}
      STORAGE_FS_ROOT: /data/storage
    volumes:
      - blobstore:/data/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5

  web:
    # Origin-agnostic image (same-origin at runtime - see apps/web/lib/api-base.ts),
    # so no PUBLIC_ORIGIN is baked and no rebuild is needed on IP change.
    image: ghcr.io/ztur211/nodescope-web:${NODESCOPE_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: ${WEB_MEMORY_LIMIT:-192m}
          cpus: "${WEB_CPU_LIMIT:-0.5}"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      API_UPSTREAM: api:3000
    ports:
      - "${WEB_PORT:-8080}:80"

  # Optional: Cloudflare Tunnel (free TLS + hostname, no inbound ports).
  # Enable with `--profile tunnel`. In the Cloudflare dashboard, route your
  # hostname to http://web:80; paste the tunnel token into deploy/.env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    logging: *default-logging
    command: ["tunnel", "--no-autoupdate", "run"]
    deploy:
      resources:
        limits:
          memory: ${TUNNEL_MEMORY_LIMIT:-128m}
          cpus: "${TUNNEL_CPU_LIMIT:-0.5}"
    environment:
      # Plain default (not `:?`) so `docker compose config/up` without the
      # `tunnel` profile don't fail on a missing token - compose interpolates
      # every service's env at parse time regardless of active profiles.
      # cloudflared only runs under `--profile tunnel`, where an empty token
      # makes it exit with a clear error.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  blobstore:
