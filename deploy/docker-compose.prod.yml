# NodeScope self-hosted demo stack. See deploy/README.md for the full runbook.
#
#   cp deploy/.env.example deploy/.env     # then fill in secrets + PUBLIC_ORIGIN
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# Add `--profile tunnel` to also run cloudflared (needs CLOUDFLARE_TUNNEL_TOKEN).
# Build context is the repo root (..), so the -f path is all you need.

name: nodescope

# Bound container logs so a long-running demo can't fill the host disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nodescope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-nodescope}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nodescope} -d ${POSTGRES_DB:-nodescope}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No host port published — reachable only inside the compose network.

  # Redis is OPTIONAL — only needed for MULTI-REPLICA deployments. The single-node
  # appliance runs the API against an in-memory backing and never starts this service.
  # Enable it with `--profile redis` and set REDIS_URL + CLUSTER_MODE in deploy/.env.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    profiles: ["redis"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    logging: *default-logging
    # No hard dependency on redis: single-node boots without it. When you run
    # `--profile redis`, start redis first (or just re-run `up`, it will start too).
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-nodescope}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nodescope}
      # Empty by default = single-node in-memory backing. For multi-replica set this to
      # redis://redis:6379 and CLUSTER_MODE=true in deploy/.env, and use `--profile redis`.
      REDIS_URL: ${REDIS_URL:-}
      CLUSTER_MODE: ${CLUSTER_MODE:-false}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in deploy/.env}
      # CryptoModule (SNMP credential encryption) refuses to boot without a
      # base64-encoded 32-byte key: `openssl rand -base64 32`.
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY in deploy/.env (openssl rand -base64 32)}
      # Same-origin demo: both the API base and the auth base are the public origin.
      BETTER_AUTH_URL: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in deploy/.env}
      FRONTEND_URL: ${PUBLIC_ORIGIN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in deploy/.env}
      AI_PROVIDER: ${AI_PROVIDER:-claude}
      GEOCODING_USER_AGENT: ${GEOCODING_USER_AGENT:-NodeScope/1.0 (demo@example.com)}
      # Proxy hops to trust for the real client IP (per-IP AI rate limiting +
      # checkOnHome). 1 = the single Caddy hop (default); behind Cloudflare
      # Tunnel → Caddy → API set 2.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Single-node appliance default: blobs on the local blobstore volume (no
      # MinIO/S3 to run). To use S3/MinIO instead, set STORAGE_DRIVER=s3 in
      # deploy/.env and add the STORAGE_ENDPOINT/…/SECRET_KEY env here.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-fs}
      STORAGE_FS_ROOT: /data/storage
    volumes:
      - blobstore:/data/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        # Baked into the browser bundle — rebuild (`--build`) if PUBLIC_ORIGIN changes.
        EXPO_PUBLIC_API_URL: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in deploy/.env}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      API_UPSTREAM: api:3000
    ports:
      - "${WEB_PORT:-8080}:80"

  # Optional: Cloudflare Tunnel (free TLS + hostname, no inbound ports).
  # Enable with `--profile tunnel`. In the Cloudflare dashboard, route your
  # hostname to http://web:80; paste the tunnel token into deploy/.env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    logging: *default-logging
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # Plain default (not `:?`) so `docker compose config/up` without the
      # `tunnel` profile don't fail on a missing token — compose interpolates
      # every service's env at parse time regardless of active profiles.
      # cloudflared only runs under `--profile tunnel`, where an empty token
      # makes it exit with a clear error.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  blobstore:
